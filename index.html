<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
        }
        .imagens{
            height: 200px;
            width: 300px;
        }
        .bordinha{
            border: 3px solid rgb(189, 171, 13);
            font-size: 25px;
        }
        .background{
            background-color: rgb(0, 0, 0);
            height: 15px;
        }
        #tipo1{
            font-size:32px;
            color: rgb(255, 99, 99);
            font-weight: bold;
        }
        #tipo2{
            font-size:32px;
            font-weight: bold;
        }
        #tipo3{
            background-color:rgb(98, 184, 255);
            font-weight: bold;
        }
        #tipo4{
            color: rgb(247, 25, 255);
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-weight: bold;
        }
        #tipo5{
            font-size: 25px
        }
        #tipo6{
            color: rgb(0, 155, 8);
            font-family: 'Times New Roman', Times, serif;
        }
        #tipo7{
            font-style: italic;
            font-size: 55px;
            text-decoration: underline;
            font-weight: bold;
            background-color: rgb(135, 83, 219);
            color: rgb(255, 106, 47);
        }
    </style>
</head>

<body>
    <h1 >PÁGINA TESTE CSS</h1>
    <hr class="background">
    <img src="_images/css1.jpg" class="imagens">
    <img src="_images/css02.jpg" class="imagens"> 
    <img src="_images/css03.jpg" class="imagens"> 
    <img src="_images/css04.png" class="imagens">
    <hr class="background">
    <p id="tipo1">CSS É VIDA!</p>
    <p>Diversas possibilidades de incrementar seu HTML</p>
    <p id="tipo2">Exemplo de Cores no CSS</p>
    <p id="tipo3">Exemplo de texto com cor de fundos</p>
    <hr class="background">
    <p id="tipo4">Exemplo de texto com mudança da cor da fonte</p>
    <hr class="background">
    <p class="bordinha">Exemplo de texto com borda colorida</p>
    <p id="tipo2">Misturando Tudo</p>
    <p class="bordinha" id="tipo6">Exemplo de texto com várias formatações</p>
    <hr class="background">
    <p id="tipo7">Mais um exemplo</p>
    
</body>

</html>
